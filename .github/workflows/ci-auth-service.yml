name: ☸️ Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - "gitops/**"
      - ".github/workflows/ci-auth-service.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CLUSTER_NAME: jojo-eks-cluster
  ECR_IMAGE: 052717076243.dkr.ecr.us-east-2.amazonaws.com/jojo/auth-service-default

jobs:
  deploy:
    name: 🚀 Deploy to EKS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ☘️ Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: 📝 Update image tag
        working-directory: gitops/apps/auth-service/base
        run: |
          kustomize edit set image \
            fase2-auth-service=${{ env.ECR_IMAGE }}:${{ github.sha }}

      - name: 🚀 Deploy to Kubernetes
        run: |
          kubectl apply -k gitops/overlays/prod
          kubectl rollout status deployment/auth-service -n toggle-master

      - name: 🧪 Smoke test
        continue-on-error: true
        run: |
          echo "⏳ Aguardando LoadBalancer do Ingress estar pronto..."

          # Aguardar até 2 minutos para LoadBalancer ter hostname
          for i in {1..12}; do
            LB_URL=$(kubectl get service ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            
            if [ -n "$LB_URL" ]; then
              echo "✅ LoadBalancer pronto: $LB_URL"
              break
            fi
            
            echo "⏳ Tentativa $i/12 - Aguardando LoadBalancer..."
            sleep 10
          done

          # Verificar se obteve URL
          if [ -z "$LB_URL" ]; then
            echo "⚠️ LoadBalancer ainda não está pronto (pode demorar alguns minutos)"
            echo "✅ Deploy concluído! Verifique manualmente: kubectl get ingress -n toggle-master"
            exit 0
          fi

          # Aguardar LoadBalancer propagar DNS
          echo "⏳ Aguardando LoadBalancer estar acessível..."
          sleep 15

          # Testar health endpoint
          echo "🧪 Testando: http://$LB_URL/auth/health"
          if curl -f --max-time 10 "http://$LB_URL/auth/health"; then
            echo "✅ Smoke test passed!"
          else
            echo "⚠️ Health check direto falhou, mas LoadBalancer pode estar provisionando"
            echo "✅ Verifique em alguns minutos: http://$LB_URL/auth/health"
          fi

      - name: 📊 Deployment summary
        run: |
          echo "## ☸️ Kubernetes Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster**: ${{ env.CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ env.ECR_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n toggle-master -l app=auth-service >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
