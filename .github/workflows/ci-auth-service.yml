name: ☸️ Deploy to Kubernetes - Auth Service

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - "gitops/**"
      - ".github/workflows/ci-auth-service.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CLUSTER_NAME: jojo-eks-cluster
  ECR_IMAGE: 052717076243.dkr.ecr.us-east-2.amazonaws.com/jojo/auth-service-default

jobs:
  deploy:
    name: 🚀 Deploy to EKS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ☘️ Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: 📝 Update image tag no Kustomize
        working-directory: gitops/apps/auth-service/base
        run: |
          kustomize edit set image fase2-auth-service=${{ env.ECR_IMAGE }}:${{ github.sha }}

      - name: 🚀 Deploy to Kubernetes
        run: |
          kubectl apply -k gitops/overlays/prod
          kubectl rollout status deployment/auth-service -n toggle-master --timeout=120s

      - name: 🧪 Smoke test via Ingress NLB
        continue-on-error: true
        run: |
          echo "⏳ Buscando endereço do Load Balancer..."

          for i in {1..12}; do
            LB_URL=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            
            if [ -n "$LB_URL" ]; then
              echo "✅ LoadBalancer pronto: $LB_URL"
              break
            fi
            
            echo "⏳ Tentativa $i/12 - Aguardando LoadBalancer..."
            sleep 10
          done

          if [ -z "$LB_URL" ]; then
            echo "⚠️ LoadBalancer ainda não obteve hostname público."
            exit 0
          fi

          echo "⏳ Aguardando propagação e testando health check..."
          sleep 15

          echo "🧪 Testando endpoint: http://$LB_URL/auth/health"
          if curl -f --max-time 10 "http://$LB_URL/auth/health"; then
            echo "✅ Smoke test passed!"
          else
            echo "⚠️ Health check direto falhou ou ainda está propagando DNS, testando dentro do cluster:"
            kubectl exec -n toggle-master deploy/auth-service -- wget -qO- http://localhost:8001/health || true
          fi

      - name: 📊 Deployment summary
        run: |
          echo "## ☸️ Kubernetes Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: \`${{ env.CLUSTER_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`toggle-master\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ECR_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods Status:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n toggle-master -l app=auth-service >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
