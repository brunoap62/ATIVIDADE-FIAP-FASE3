name: 🛡️ CI/CD & DevSecOps - Auth Service

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "auth-service/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: jojo/auth-service-default
  SERVICE_DIR: auth-service

jobs:
  # ============================================================================
  # ETAPA 1: EXECUÇÃO 100% EM PARALELO (Qualidade, Testes, SAST e SCA)
  # ============================================================================

  # 1.1 Linter de Código
  lint:
    name: 🔍 1.1 Linter (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configurar Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: auth-service/go.sum

      - name: 🔍 Executar Linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56
          working-directory: ${{ env.SERVICE_DIR }}
          args: --timeout=5m

  # 1.2 Testes Unitários
  unit-tests:
    name: 🧪 1.2 Testes Unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configurar Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: auth-service/go.sum

      - name: 🧪 Executar Testes com Cobertura
        run: go test -v -cover ./...

  # 1.3 SAST (Análise Estática de Segurança no Código)
  sast-scan:
    name: 🛡️ 1.3 SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛡️ Executar gosec
        uses: securego/gosec@master
        with:
          args: -exclude-dir=k8s -exclude-dir=db ./auth-service/...

  # 1.4 SCA (Análise de Vulnerabilidades em Dependências)
  sca-scan:
    name: 📦 1.4 SCA (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Escanear Dependências com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "${{ env.SERVICE_DIR }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

  # ============================================================================
  # ETAPA 2: DOCKER BUILD, CONTAINER SCAN & PUSH PARA ECR (Depende da Etapa 1)
  # ============================================================================
  build-and-push:
    name: 🐳 2. Build, Scan & Push (ECR)
    needs: [lint, unit-tests, sast-scan, sca-scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Definir Tags da Imagem
        id: meta
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "tag_sha=$IMAGE_URI:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag_latest=$IMAGE_URI:latest" >> $GITHUB_OUTPUT

      - name: 🐳 Build da Imagem Docker (Local para Scan)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_DIR }}
          file: ./${{ env.SERVICE_DIR }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tag_sha }}

      - name: 🛡️ Container Vulnerability Scan (Trivy image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tag_sha }}
          format: "table"
          exit-code: "0" # Alerte no relatório
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: 🚀 Push da Imagem para o ECR
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_DIR }}
          file: ./${{ env.SERVICE_DIR }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # ETAPA 3: GITOPS UPDATE (Depende do Build e Push para ECR)
  # ============================================================================
  gitops-update:
    name: 🔄 3. GitOps Update (ArgoCD)
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Instalar Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: 📝 Atualizar Tag no Kustomize Base
        working-directory: gitops/apps/auth-service/base
        run: |
          kustomize edit set image fase2-auth-service=052717076243.dkr.ecr.us-east-2.amazonaws.com/jojo/auth-service-default:${{ github.sha }}

      - name: 🚀 Commit e Push da nova tag para GitOps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/auth-service/base/kustomization.yml
          
          # Só commita se houver alterações
          if git diff --staged --quiet; then
            echo "Nenhuma alteração na tag do Kustomize."
          else
            git commit -m "chore(gitops): update auth-service image tag to ${{ github.sha }} [skip ci]"
            git push origin main
          fi

      - name: 📊 Resumo do Deploy
        run: |
          echo "## 🚀 Pipeline Concluído com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Serviço**: \`auth-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Image**: \`${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitOps**: Tag atualizada no Kustomize. O ArgoCD fará a sincronização automática no cluster EKS." >> $GITHUB_STEP_SUMMARY
