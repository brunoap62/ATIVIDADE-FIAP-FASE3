name: 🚀 Auth Service - DevSecOps & GitOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
  pull_request:
    branches: [main]
    paths:
      - "auth-service/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: ${{ secrets.PROJECT_NAME }}-eks-cluster
  ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}/auth-service-default
  SERVICE_DIR: auth-service
  ARGOCD_APP_FILE: gitops/argocd-app-prod.yml

jobs:
  # ==============================================================================
  # STAGE 1 (PARALELO): Testes Unitários
  # ==============================================================================
  unit-tests:
    name: 🧪 Stage 1A - Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ env.SERVICE_DIR }}/go.sum

      - name: 📦 Download de Dependências
        working-directory: ${{ env.SERVICE_DIR }}
        run: go mod download

      - name: 🧪 Executar Testes Unitários
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          echo "Executando testes unitários com detecção de concorrência (-race)..."
          go test -v -race ./...

  # ==============================================================================
  # STAGE 1 (PARALELO): Linter & Análise Estática
  # ==============================================================================
  lint-analysis:
    name: 🔍 Stage 1B - Linter (golangci-lint)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ env.SERVICE_DIR }}/go.sum

      - name: 📦 Download de Dependências
        working-directory: ${{ env.SERVICE_DIR }}
        run: go mod download

      - name: 🔍 Instalar e Executar golangci-lint
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          echo "Instalando golangci-lint..."
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.61.0
          echo "Executando análise estática..."
          golangci-lint run --timeout=5m ./... || echo "⚠️ Linter finalizado com avisos informativos."

  # ==============================================================================
  # STAGE 1 (PARALELO): SAST com Horusec
  # ==============================================================================
  sast-horusec:
    name: 🔒 Stage 1C - SAST (Horusec)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Executar Horusec SAST
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: >
            -p ./${{ env.SERVICE_DIR }}
            -o json
            -O horusec-results.json
            --ignore-severity="LOW,INFO"
            --return-error=true
            --disable-docker=true

      - name: 📤 Upload Relatório Horusec
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-report-${{ env.SERVICE_DIR }}
          path: horusec-results.json
          retention-days: 30

  # ==============================================================================
  # STAGE 1 (PARALELO): SCA com Trivy FS
  # ==============================================================================
  sca-trivy-fs:
    name: 🛡️ Stage 1D - SCA (Trivy FS)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔍 Trivy FS Scan (Table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SERVICE_DIR }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: 📄 Gerar Relatório JSON do Trivy SCA
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SERVICE_DIR }}'
          format: 'json'
          output: 'trivy-sca-results.json'

      - name: 📤 Upload Relatório Trivy SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report-${{ env.SERVICE_DIR }}
          path: trivy-sca-results.json
          retention-days: 30

  # ==============================================================================
  # STAGE 2: Build Docker & Container Image Security Scan (Fan-In após Stage 1)
  # ==============================================================================
  build-and-container-scan:
    name: 🐳 Stage 2 - Build Docker & Container Scan
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-analysis, sast-horusec, sca-trivy-fs]
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 🔨 Build Local Docker Image
        run: |
          echo "Construindo imagem local para Container Scan..."
          docker build --platform linux/amd64 -t ${{ env.SERVICE_DIR }}:local ./${{ env.SERVICE_DIR }}

      - name: 🔍 Container Security Scan (Table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.SERVICE_DIR }}:local'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: 📄 Gerar Relatório JSON do Container Scan
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'image'
          image-ref: '${{ env.SERVICE_DIR }}:local'
          format: 'json'
          output: 'trivy-container-results.json'

      - name: 📤 Upload Relatório Container Scan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-report-${{ env.SERVICE_DIR }}
          path: trivy-container-results.json
          retention-days: 30

      - name: 🔑 Configure AWS credentials (Push to ECR)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Push Docker Image to ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "Tagging e enviando para o ECR..."
          docker tag ${{ env.SERVICE_DIR }}:local $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag ${{ env.SERVICE_DIR }}:local $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Imagem enviada ao ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ==============================================================================
  # STAGE 3: Atualizar Manifests GitOps no Repositório
  # ==============================================================================
  update-gitops:
    name: 📝 Stage 3 - Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: build-and-container-scan
    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📝 Update image tag in kustomization
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry || needs.build-and-container-scan.outputs.ecr-registry }}
          IMAGE_TAG: ${{ needs.build-and-container-scan.outputs.image-tag }}
        run: |
          cd gitops/apps/auth-service/base

          echo "🔄 Updating image tag to: $IMAGE_TAG (Registry: $ECR_REGISTRY)"
          kustomize edit set image \
            fase2-auth-service=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "✅ Kustomization updated"
          cat kustomization.yml

      - name: 💾 Commit and push changes
        env:
          IMAGE_TAG: ${{ needs.build-and-container-scan.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/auth-service/base/kustomization.yml

          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "chore(gitops): update auth-service image to $IMAGE_TAG [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
            echo "✅ Changes pushed to repository"
          fi

  # ==============================================================================
  # STAGE 4: Validar Manifests Kustomize
  # ==============================================================================
  validate-manifests:
    name: ✅ Stage 4 - Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: update-gitops
    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: ✅ Validate Kubernetes manifests
        run: |
          echo "🔍 Validating manifests with Kustomize..."
          cd gitops/overlays/prod
          kustomize build . > /tmp/manifests.yaml
          echo "✅ Manifests are valid"

  # ==============================================================================
  # STAGE 5: Garantir Aplicação no ArgoCD
  # ==============================================================================
  ensure-argocd-app:
    name: 🚀 Stage 5 - Ensure ArgoCD Application
    runs-on: ubuntu-latest
    needs: [update-gitops, validate-manifests]
    if: github.event_name != 'pull_request'
    outputs:
      app-name: ${{ steps.verify-app.outputs.app_name }}
      app-status: ${{ steps.verify-app.outputs.app_status }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔄 Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: 🚀 Verify & Apply ArgoCD Application
        id: verify-app
        run: |
          APP_NAME=$(grep -E '^\s*name:' ${{ env.ARGOCD_APP_FILE }} | head -n 1 | awk '{print $2}')
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

          echo "🔍 Verificando se a aplicação '$APP_NAME' existe no ArgoCD..."
          if ! kubectl get application "$APP_NAME" -n argocd &> /dev/null; then
            echo "⚠️ Application '$APP_NAME' não encontrada. Criando agora..."
            kubectl apply -f ${{ env.ARGOCD_APP_FILE }}
            echo "app_status=✨ Criada com sucesso" >> $GITHUB_OUTPUT
          else
            echo "✅ Application '$APP_NAME' já existe no cluster. Aplicando manifesto..."
            APPLY_OUT=$(kubectl apply -f ${{ env.ARGOCD_APP_FILE }})
            echo "$APPLY_OUT"
            echo "app_status=🔄 Atualizada (Configured)" >> $GITHUB_OUTPUT
          fi

  # ==============================================================================
  # STAGE 6: Pipeline Summary Geral (Quality Gate Report)
  # ==============================================================================
  pipeline-summary:
    name: 📊 Stage 6 - Quality Gate & Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-analysis, sast-horusec, sca-trivy-fs, build-and-container-scan, update-gitops, validate-manifests, ensure-argocd-app]
    if: always()

    steps:
      - name: 📊 Complete Pipeline Summary
        run: |
          echo "## 🛡️ DevSecOps Multi-Stage Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Estágio | Job | Status | Detalhes |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Stage 1A** | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passou' || '❌ Falhou' }} | go test -v -race |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 **Stage 1B** | Linter | ${{ needs.lint-analysis.result == 'success' && '✅ Passou' || '❌ Falhou' }} | golangci-lint |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 **Stage 1C** | SAST | ${{ needs.sast-horusec.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Horusec (Bloqueia CRITICAL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Stage 1D** | SCA | ${{ needs.sca-trivy-fs.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Trivy FS (Bloqueia CRITICAL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 **Stage 2** | Build & Container Scan | ${{ needs.build-and-container-scan.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Trivy Image & ECR Push |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 **Stage 3** | GitOps Update | ${{ needs.update-gitops.result == 'success' && '✅ Passou' || (github.event_name == 'pull_request' && '⏭️ Ignorado (PR)' || '❌ Falhou') }} | Kustomize Manifests |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **Stage 5** | ArgoCD Application | ${{ needs.ensure-argocd-app.result == 'success' && '✅ Passou' || (github.event_name == 'pull_request' && '⏭️ Ignorado (PR)' || '❌ Falhou') }} | Rollout no EKS |" >> $GITHUB_STEP_SUMMARY
