name: CI/CD & DevSecOps - Auth Service

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/auth-service
  SERVICE_DIR: auth-service

jobs:
  # ============================================================================
  # 1. Build & Unit Test & Linter
  # ============================================================================
  build-and-test:
    name: 1. Build, Test & Lint (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: auth-service/go.sum

      - name: Baixar Dependências
        run: go mod download

      - name: Executar Testes Unitários
        run: go test -v -cover ./...

      - name: Executar Compilação (Build)
        run: CGO_ENABLED=0 go build -v -o auth-service .

      - name: Executar Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56
          working-directory: auth-service
          args: --timeout=5m
