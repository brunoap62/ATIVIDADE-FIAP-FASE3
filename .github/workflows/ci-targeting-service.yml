name: 🚀 Targeting Service - DevSecOps & GitOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "targeting-service/**"
  pull_request:
    branches: [main]
    paths:
      - "targeting-service/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: ${{ secrets.PROJECT_NAME }}-eks-cluster
  ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}/targeting-service-default
  SERVICE_DIR: targeting-service
  ARGOCD_APP_FILE: gitops/argocd-app-prod.yml

jobs:
  # ==============================================================================
  # STAGE 1: Testes Unitários & Análise Estática (Linter)
  # ==============================================================================
  test-and-lint:
    name: 🧪 Stage 1 - Unit Tests & Linter
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar Dependências e Ferramental de Teste
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      - name: 🧪 Executar Testes Unitários
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          echo "Executando testes unitários com pytest..."
          pytest tests/ -v

      - name: 🔍 Executar Linter (flake8)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          echo "Executando análise de erros de sintaxe e estilo com flake8..."
          # Para erros de sintaxe graves ou nomes indefinidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Para avisos gerais de complexidade/estilo (informativo)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 📊 Test & Lint Summary
        run: |
          echo "## 🧪 Stage 1: Test & Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`${{ env.SERVICE_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests:** ✅ Passed (\`pytest\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter:** ✅ Passed (\`flake8\`)" >> $GITHUB_STEP_SUMMARY

  # ==============================================================================
  # STAGE 2: DevSecOps Scan (SAST com Horusec & SCA com Trivy FS)
  # ==============================================================================
  security-sast-sca:
    name: 🛡️ Stage 2 - SAST (Horusec) & SCA (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔒 SAST (Static Application Security Testing) - Horusec
        run: |
          echo "Instalando Horusec CLI..."
          curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest
          echo "Executando SAST com Horusec na pasta ${{ env.SERVICE_DIR }}..."
          horusec start -p ./${{ env.SERVICE_DIR }} -P "$(pwd)" --return-error=true -s="CRITICAL" --log-level=error

      - name: 🛡️ SCA (Software Composition Analysis) - Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SERVICE_DIR }}'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: 📊 Security Scan Summary
        run: |
          echo "## 🛡️ Stage 2: Security Scan (SAST & SCA) Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **SAST (Horusec):** ✅ Passed (Zero vulnerabilidades CRÍTICAS)" >> $GITHUB_STEP_SUMMARY
          echo "- **SCA (Trivy FS):** ✅ Passed (Zero dependências CRÍTICAS)" >> $GITHUB_STEP_SUMMARY

  # ==============================================================================
  # STAGE 3: Build Docker & Container Image Security Scan
  # ==============================================================================
  build-and-container-scan:
    name: 🐳 Stage 3 - Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: security-sast-sca
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 🔨 Build Local Docker Image
        run: |
          echo "Construindo imagem local para Container Scan..."
          docker build --platform linux/amd64 -t ${{ env.SERVICE_DIR }}:local ./${{ env.SERVICE_DIR }}

      - name: 🔍 Container Security Scan - Trivy Image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.SERVICE_DIR }}:local'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: 🔑 Configure AWS credentials (Push to ECR)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📤 Push Docker Image to ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "Tagging e enviando para o ECR..."
          docker tag ${{ env.SERVICE_DIR }}:local $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag ${{ env.SERVICE_DIR }}:local $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Imagem enviada ao ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: 📊 Container Scan & Build Summary
        run: |
          echo "## 🐳 Stage 3: Build & Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Scan:** ✅ Passed (Trivy Image Scan - Zero CRITICAL)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- **ECR Push:** ✅ Pushed tag \`${{ steps.set-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **ECR Push:** ⏭️ Skipped (Pull Request mode)" >> $GITHUB_STEP_SUMMARY
          fi

  # ==============================================================================
  # STAGE 4: Atualizar Manifests GitOps no Repositório
  # ==============================================================================
  update-gitops:
    name: 📝 Stage 4 - Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: build-and-container-scan
    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📝 Update image tag in kustomization
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry || needs.build-and-container-scan.outputs.ecr-registry }}
          IMAGE_TAG: ${{ needs.build-and-container-scan.outputs.image-tag }}
        run: |
          cd gitops/apps/targeting-service/base

          echo "🔄 Updating image tag to: $IMAGE_TAG (Registry: $ECR_REGISTRY)"
          kustomize edit set image \
            fase2-targeting-service=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "✅ Kustomization updated"
          cat kustomization.yml

      - name: 💾 Commit and push changes
        env:
          IMAGE_TAG: ${{ needs.build-and-container-scan.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/targeting-service/base/kustomization.yml

          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "chore(gitops): update targeting-service image to $IMAGE_TAG [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
            echo "✅ Changes pushed to repository"
          fi

      - name: 📊 GitOps Summary
        env:
          IMAGE_TAG: ${{ needs.build-and-container-scan.outputs.image-tag }}
        run: |
          echo "## 📝 GitOps Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`targeting-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- **New Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Manifests Updated and Committed to Git" >> $GITHUB_STEP_SUMMARY

  # ==============================================================================
  # STAGE 5: Validar Manifests Kustomize
  # ==============================================================================
  validate-manifests:
    name: ✅ Stage 5 - Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: update-gitops
    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: ✅ Validate Kubernetes manifests
        run: |
          echo "🔍 Validating manifests with Kustomize..."
          cd gitops/overlays/prod
          kustomize build . > /tmp/manifests.yaml
          echo "✅ Manifests are valid"

      - name: 📊 Validation Summary
        run: |
          echo "## ✅ Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Manifests Validated" >> $GITHUB_STEP_SUMMARY
          echo "- **Note:** ArgoCD will auto-sync changes to EKS" >> $GITHUB_STEP_SUMMARY

  # ==============================================================================
  # STAGE 6: Garantir Aplicação no ArgoCD
  # ==============================================================================
  ensure-argocd-app:
    name: 🚀 Stage 6 - Ensure ArgoCD Application
    runs-on: ubuntu-latest
    needs: [update-gitops, validate-manifests]
    if: github.event_name != 'pull_request'
    outputs:
      app-name: ${{ steps.verify-app.outputs.app_name }}
      app-status: ${{ steps.verify-app.outputs.app_status }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔄 Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: 🚀 Verify & Apply ArgoCD Application
        id: verify-app
        run: |
          APP_NAME=$(grep -E '^\s*name:' ${{ env.ARGOCD_APP_FILE }} | head -n 1 | awk '{print $2}')
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

          echo "🔍 Verificando se a aplicação '$APP_NAME' existe no ArgoCD..."
          if ! kubectl get application "$APP_NAME" -n argocd &> /dev/null; then
            echo "⚠️ Application '$APP_NAME' não encontrada. Criando agora..."
            kubectl apply -f ${{ env.ARGOCD_APP_FILE }}
            echo "app_status=✨ Criada com sucesso" >> $GITHUB_OUTPUT
          else
            echo "✅ Application '$APP_NAME' já existe no cluster. Aplicando manifesto..."
            APPLY_OUT=$(kubectl apply -f ${{ env.ARGOCD_APP_FILE }})
            echo "$APPLY_OUT"
            echo "app_status=🔄 Atualizada (Configured)" >> $GITHUB_OUTPUT
          fi

  # ==============================================================================
  # STAGE 7: Pipeline Summary Geral
  # ==============================================================================
  pipeline-summary:
    name: 📊 Stage 7 - Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test-and-lint, security-sast-sca, build-and-container-scan, update-gitops, validate-manifests, ensure-argocd-app]
    if: always()

    steps:
      - name: 📊 Complete Pipeline Summary
        run: |
          echo "## 🛡️ DevSecOps & GitOps Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Estágio | Status | Detalhes |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **1. Unit Test & Lint** | ${{ needs.test-and-lint.result == 'success' && '✅ Passou' || '❌ Falhou' }} | pytest & flake8 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 **2. SAST & SCA** | ${{ needs.security-sast-sca.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Horusec & Trivy FS (Quality Gate) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 **3. Docker & Container Scan** | ${{ needs.build-and-container-scan.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Trivy Image Scan (Quality Gate) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 **4. GitOps Update** | ${{ needs.update-gitops.result == 'success' && '✅ Passou' || (github.event_name == 'pull_request' && '⏭️ Ignorado (PR)' || '❌ Falhou') }} | Kustomize & Git Sync |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **5. ArgoCD Application** | ${{ needs.ensure-argocd-app.result == 'success' && '✅ Passou' || (github.event_name == 'pull_request' && '⏭️ Ignorado (PR)' || '❌ Falhou') }} | Rollout no EKS |" >> $GITHUB_STEP_SUMMARY
