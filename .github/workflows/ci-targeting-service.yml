name: 🚀 GitOps Pipeline - Build, Update & Sync (Targeting Service)

on:
  push:
    branches: [main]
    paths:
      - "targeting-service/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: ${{ secrets.PROJECT_NAME }}-eks-cluster
  ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}/targeting-service-default
  SERVICE_DIR: targeting-service
  ARGOCD_APP_FILE: gitops/argocd-app-prod.yml

jobs:
  # ============================================
  # JOB 1: Build e Push da Imagem Docker
  # ============================================
  build-and-push:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 🐳 Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "🔨 Building Docker image..."
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./${{ env.SERVICE_DIR }}

          echo "📤 Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: 📊 Build Summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Built and Pushed to ECR" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 2: Atualizar Manifests GitOps no Repositório
  # ============================================
  update-gitops:
    name: 📝 Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 📝 Update image tag in kustomization
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry || needs.build-and-push.outputs.ecr-registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          cd gitops/apps/targeting-service/base

          echo "🔄 Updating image tag to: $IMAGE_TAG (Registry: $ECR_REGISTRY)"
          kustomize edit set image \
            fase2-targeting-service=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "✅ Kustomization updated"
          cat kustomization.yml

      - name: 💾 Commit and push changes
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/targeting-service/base/kustomization.yml

          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "chore(gitops): update targeting-service image to $IMAGE_TAG [skip ci]"
            git push origin main
            echo "✅ Changes pushed to repository"
          fi

      - name: 📊 GitOps Summary
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          echo "## 📝 GitOps Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`targeting-service\`" >> $GITHUB_STEP_SUMMARY
          echo "**New Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Manifests Updated and Committed to Git" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 3: Validar Manifests Kustomize
  # ============================================
  validate-manifests:
    name: ✅ Validate Manifests
    runs-on: ubuntu-latest
    needs: update-gitops

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🔧 Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: ✅ Validate Kubernetes manifests
        run: |
          echo "🔍 Validating manifests with Kustomize..."
          cd gitops/overlays/prod

          kustomize build . > /tmp/manifests.yaml

          echo "✅ Manifests are valid"

      - name: 📊 Validation Summary
        run: |
          echo "## ✅ Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Manifests Validated" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** ArgoCD will auto-sync changes to EKS" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 4: Garantir Aplicação no ArgoCD
  # ============================================
  ensure-argocd-app:
    name: 🚀 Ensure ArgoCD Application
    runs-on: ubuntu-latest
    needs: [update-gitops, validate-manifests]
    outputs:
      app-name: ${{ steps.verify-app.outputs.app_name }}
      app-status: ${{ steps.verify-app.outputs.app_status }}
      app-action: ${{ steps.verify-app.outputs.app_action }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔄 Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: 🚀 Verify & Apply ArgoCD Application
        id: verify-app
        run: |
          APP_NAME=$(grep -E '^\s*name:' ${{ env.ARGOCD_APP_FILE }} | head -n 1 | awk '{print $2}')
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          
          echo "🔍 Verificando se a aplicação '$APP_NAME' existe no ArgoCD..."
          
          if ! kubectl get application "$APP_NAME" -n argocd &> /dev/null; then
            echo "⚠️ Application '$APP_NAME' não encontrada. Criando agora..."
            kubectl apply -f ${{ env.ARGOCD_APP_FILE }}
            echo "app_action=created" >> $GITHUB_OUTPUT
            echo "app_status=✨ Criada com sucesso" >> $GITHUB_OUTPUT
          else
            echo "✅ Application '$APP_NAME' já existe no cluster. Aplicando manifesto..."
            APPLY_OUT=$(kubectl apply -f ${{ env.ARGOCD_APP_FILE }})
            echo "$APPLY_OUT"
            if [[ "$APPLY_OUT" =~ "configured" ]]; then
              echo "app_action=updated" >> $GITHUB_OUTPUT
              echo "app_status=🔄 Atualizada (Configured)" >> $GITHUB_OUTPUT
            else
              echo "app_action=unchanged" >> $GITHUB_OUTPUT
              echo "app_status=✅ Já existia (Unchanged)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 📊 ArgoCD App Summary
        if: always()
        run: |
          echo "## 🚀 ArgoCD Application Step" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Aplicação** | \`${{ steps.verify-app.outputs.app_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | \`${{ env.CLUSTER_NAME }}\` (\`${{ env.AWS_REGION }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Manifesto** | \`${{ env.ARGOCD_APP_FILE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resultado** | ${{ steps.verify-app.outputs.app_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 5: Pipeline Summary
  # ============================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, update-gitops, validate-manifests, ensure-argocd-app]
    if: always()
    steps:
      - name: 📊 Complete Pipeline Summary
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr-registry }}
          APP_STATUS: ${{ needs.ensure-argocd-app.outputs.app-status }}
          APP_NAME: ${{ needs.ensure-argocd-app.outputs.app-name }}
        run: |
          echo "## 🚀 GitOps Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. 🐳 **Build & Push:** ✅ Image built and pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "2. 📝 **Update GitOps:** ✅ Manifests updated in Git" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ **Validate:** ✅ Manifests validated" >> $GITHUB_STEP_SUMMARY
          echo "4. 🚀 **ArgoCD App:** $APP_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ArgoCD App:** \`$APP_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** 🎉 **READY - ArgoCD is syncing to EKS automatically**" >> $GITHUB_STEP_SUMMARY
