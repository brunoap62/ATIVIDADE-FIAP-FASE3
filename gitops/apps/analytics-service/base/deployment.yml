apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service
  namespace: toggle-master

spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      serviceAccountName: analytics-service-sa
      containers:
        - name: analytics-service
          image: fase2-analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: analytics-service-config
            - secretRef:
                name: analytics-service-secret
          startupProbe:
            httpGet:
              path: /health
              port: 8005
            failureThreshold: 5
            successThreshold: 1
            timeoutSeconds: 2
            periodSeconds: 10
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 2
            periodSeconds: 15
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            failureThreshold: 5
            successThreshold: 1
            periodSeconds: 10
            timeoutSeconds: 2
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
