apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toggle-master

resources:
- configmap.yml
- deployment.yml
- externalsecret.yml
- service.yml


# ============================================
# IMAGENS
# ============================================
# Configuração de imagens Docker
# Permite substituir tags sem modificar os YAMLs
# O "name" deve corresponder ao placeholder no deployment.yaml
# O "newName" é a imagem real no ECR
images:
- name: fase2-auth-service
  newName: /super-app/auth-service-default
  newTag: 6ef576c329488f581d029013e2f426e1eeefc02e
