apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toggle-master

resources:
- configmap.yml
- deployment.yml
- externalsecret.yml
- service.yml


# ============================================
# IMAGENS
# ============================================
# Configuração de imagens Docker
# Permite substituir tags sem modificar os YAMLs
# O "name" deve corresponder ao placeholder no deployment.yaml
# O "newName" é a imagem real no ECR
images:
- name: fase2-auth-service
  newName: 052717076243.dkr.ecr.us-east-2.amazonaws.com/toggle-master-fase3/auth-service
  newTag: 8bf6dc8ee24e646d8925798da5fffe02703a42c2
